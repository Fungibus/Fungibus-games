<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta
      name="description"
      content="A small home for browser-based mini game projects."
    >
    <title>fungibus-games</title>
    <link rel="stylesheet" href="/shared/styles.css">
    <link rel="stylesheet" href="/shared/home.css">
    <script type="module" src="/shared/home.js"></script>
  </head>
  <body>
    <main class="page-shell">
      <section class="intro intro-scene" aria-labelledby="intro-title">
        <div class="intro-text">
          <p class="eyebrow">In progress</p>
          <h1 id="intro-title">fungibus-games</h1>
          <p class="intro-copy">
            Small web games you can play with your friends, no downloads or installs.
          </p>
        </div>

        <figure class="pixel-art-card" aria-label="Cute pixel mushroom bus mascot">
          <svg
            class="pixel-mascot"
            viewBox="0 0 160 160"
            role="img"
            aria-labelledby="pixel-mascot-title"
          >
            <title id="pixel-mascot-title">Cute pixel mushroom bus mascot</title>
            <rect class="pixel-shadow" x="30" y="132" width="100" height="10"></rect>

            <rect class="pixel-outline" x="50" y="20" width="60" height="10"></rect>
            <rect class="pixel-outline" x="30" y="30" width="100" height="10"></rect>
            <rect class="pixel-outline" x="20" y="40" width="120" height="30"></rect>
            <rect class="pixel-outline" x="30" y="70" width="100" height="20"></rect>
            <rect class="pixel-outline" x="40" y="90" width="80" height="40"></rect>

            <rect class="pixel-cap" x="50" y="30" width="60" height="10"></rect>
            <rect class="pixel-cap" x="30" y="40" width="100" height="20"></rect>
            <rect class="pixel-cap-dark" x="20" y="50" width="120" height="20"></rect>
            <rect class="pixel-cap" x="30" y="50" width="100" height="20"></rect>
            <rect class="pixel-cap-dark" x="40" y="70" width="80" height="10"></rect>

            <rect class="pixel-spot" x="52" y="38" width="18" height="12"></rect>
            <rect class="pixel-spot" x="92" y="42" width="24" height="12"></rect>
            <rect class="pixel-spot" x="76" y="58" width="14" height="12"></rect>

            <rect class="pixel-body" x="40" y="80" width="80" height="10"></rect>
            <rect class="pixel-body" x="50" y="90" width="60" height="30"></rect>
            <rect class="pixel-body-dark" x="50" y="120" width="60" height="10"></rect>

            <rect class="pixel-window" x="54" y="88" width="18" height="16"></rect>
            <rect class="pixel-window" x="88" y="88" width="18" height="16"></rect>
            <rect class="pixel-highlight" x="58" y="90" width="6" height="6"></rect>
            <rect class="pixel-highlight" x="92" y="90" width="6" height="6"></rect>

            <rect class="pixel-face" x="62" y="110" width="8" height="8"></rect>
            <rect class="pixel-face" x="90" y="110" width="8" height="8"></rect>
            <rect class="pixel-cheek" x="50" y="112" width="8" height="8"></rect>
            <rect class="pixel-cheek" x="102" y="112" width="8" height="8"></rect>
            <rect class="pixel-face" x="74" y="120" width="12" height="4"></rect>

            <rect class="pixel-wheel" x="34" y="120" width="20" height="20"></rect>
            <rect class="pixel-wheel" x="106" y="120" width="20" height="20"></rect>
            <rect class="pixel-hub" x="40" y="126" width="8" height="8"></rect>
            <rect class="pixel-hub" x="112" y="126" width="8" height="8"></rect>

            <rect class="pixel-flower-stem" x="128" y="94" width="6" height="24"></rect>
            <rect class="pixel-flower" x="122" y="86" width="8" height="8"></rect>
            <rect class="pixel-flower" x="134" y="86" width="8" height="8"></rect>
            <rect class="pixel-flower" x="128" y="80" width="8" height="8"></rect>
            <rect class="pixel-flower-center" x="128" y="88" width="8" height="8"></rect>
          </svg>
        </figure>
      </section>

      <section class="projects" aria-labelledby="projects-title">
        <div class="section-header">
          <p class="eyebrow">Available</p>
          <h2 id="projects-title">Games</h2>
        </div>

        <div id="gameGrid" class="project-grid"></div>
      </section>
    </main>
  </body>
</html>
