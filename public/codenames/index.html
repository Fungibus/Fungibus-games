<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta
      name="description"
      content="Codename Grid, a minimal shared word board game."
    >
    <title>Codename Grid</title>
    <link rel="stylesheet" href="/styles.css">
    <script src="/codenames/codenames.js" defer></script>
  </head>
  <body>
    <header class="game-header">
      <a class="home-link" href="/">Mini Game Projects</a>
      <div class="room-strip" aria-live="polite">
        <span id="connectionLabel" class="connection-dot is-offline"></span>
        <span id="roomLabel">No room</span>
      </div>
    </header>

    <main class="game-shell">
      <section class="room-panel" aria-label="Codename Grid room controls">
        <div class="section-header compact">
          <p class="eyebrow">Codename Grid</p>
        </div>

        <form id="roomForm" class="stacked-form">
          <label>
            <span>Name</span>
            <input id="playerName" name="playerName" maxlength="24" autocomplete="name">
          </label>
          <button id="createRoomButton" type="submit">Create room</button>
        </form>

        <div id="shareBlock" class="share-block" hidden>
          <label>
            <span>Share link</span>
            <input id="shareUrl" readonly aria-label="Share link">
          </label>
          <button id="copyShareButton" class="secondary" type="button" disabled>Copy link</button>
        </div>

        <div id="gameControlBlock" class="button-row">
          <button id="newGameButton" type="button">Start game</button>
        </div>

        <div class="panel-block">
          <h2>Log</h2>
          <ol id="actionLog" class="action-log" aria-live="polite">
            <li>Create a room or open a shared link.</li>
          </ol>
        </div>

        <div class="team-controls" aria-label="Player settings">
          <button class="secondary" type="button" data-team-button="red">Red Team</button>
          <button class="secondary" type="button" data-team-button="blue">Blue Team</button>
          <button class="secondary" type="button" data-spymaster-button="red">Red Spymaster</button>
          <button class="secondary" type="button" data-spymaster-button="blue">Blue Spymaster</button>
        </div>

        <section class="players-block" aria-labelledby="teams-title">
          <h2 id="teams-title">Teams</h2>
          <div id="teamsList" class="teams-list"></div>
        </section>
      </section>

      <section class="board-section" aria-label="Board">
        <div class="board-topline">
          <div id="turnBadge" class="turn-banner">No game</div>
          <div class="score-strip" aria-label="Remaining cards">
            <span id="redScore">Red -</span>
            <span id="blueScore">Blue -</span>
          </div>
        </div>

        <div id="boardGrid" class="board-grid" aria-live="polite"></div>
        <form id="clueForm" class="clue-form">
          <label class="clue-word-field">
            <span>Clue</span>
            <input id="clueWord" maxlength="24" autocomplete="off" spellcheck="false">
          </label>
          <label class="clue-count-field">
            <span>Count</span>
            <input id="clueCount" type="number" min="0" max="9" value="1">
          </label>
          <button type="submit">Send clue</button>
          <button id="endTurnButton" class="secondary" type="button">End turn</button>
        </form>
      </section>
    </main>
  </body>
</html>
