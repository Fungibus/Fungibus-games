<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta
      name="description"
      content="Just One, a cooperative browser clue game with duplicate clue removal."
    >
    <title>Just One</title>
    <link rel="stylesheet" href="/shared/styles.css">
    <link rel="stylesheet" href="/games/just-one/just-one.css">
    <script src="/games/just-one/just-one.js" defer></script>
  </head>
  <body>
    <header class="game-header">
      <a class="home-link" href="/">fungibus-games</a>
      <div class="room-strip" aria-live="polite">
        <span id="connectionLabel" class="connection-dot is-offline" aria-hidden="true"></span>
        <span id="roomLabel">No room</span>
      </div>
    </header>

    <main class="just-one-shell">
      <section class="table-section" aria-label="Just One table">
        <div class="status-rail">
          <div>
            <p id="phaseEyebrow" class="eyebrow">Room</p>
            <h1 id="phaseTitle">Create a room</h1>
            <p id="phaseCopy" class="phase-copy">Invite 3-7 players, then start.</p>
          </div>
          <div id="scoreBadge" class="score-badge">0/13</div>
        </div>

        <section class="word-stage" aria-label="Mystery word">
          <div>
            <p class="eyebrow">Mystery word</p>
            <div id="mysteryWord" class="mystery-word">Hidden</div>
          </div>
          <div id="cardBoard" class="card-board" aria-live="polite"></div>
          <div id="clueBoard" class="clue-board" aria-live="polite"></div>
        </section>

        <section class="action-console" aria-label="Round controls">
          <div id="numberPanel" class="number-panel" aria-label="Choose mystery word"></div>

          <form id="clueForm" class="clue-form">
            <label>
              <span id="clueLabel">Your clue</span>
              <input id="clueInput" maxlength="32" autocomplete="off" spellcheck="false">
            </label>
            <button type="submit">Lock clue</button>
          </form>

          <form id="guessForm" class="guess-form">
            <label>
              <span>Guess</span>
              <input id="guessInput" maxlength="48" autocomplete="off" spellcheck="false">
            </label>
            <div class="guess-actions">
              <button type="submit">Submit guess</button>
              <button id="passButton" class="secondary" type="button">Pass</button>
            </div>
          </form>

          <div id="checkPanel" class="check-panel" aria-live="polite">
            <div>
              <span>Guess</span>
              <strong id="submittedGuess">-</strong>
            </div>
            <div class="guess-actions">
              <button type="button" data-check-result="correct">Correct</button>
              <button class="secondary danger" type="button" data-check-result="wrong">Wrong</button>
            </div>
          </div>

          <p id="noticeLine" class="notice-line" aria-live="polite">Create a room or open a shared link.</p>
        </section>
      </section>

      <aside class="room-panel" aria-label="Just One room controls">
        <div class="section-header compact">
          <p class="eyebrow">Room</p>
          <h2>Just One</h2>
        </div>

        <form id="roomForm" class="stacked-form">
          <label>
            <span>Name</span>
            <input id="playerName" name="playerName" maxlength="24" autocomplete="name">
          </label>
          <button id="createRoomButton" type="submit">Create room</button>
        </form>

        <div id="shareBlock" class="share-block" hidden>
          <label>
            <span>Share link</span>
            <input id="shareUrl" readonly aria-label="Share link">
          </label>
          <button id="copyShareButton" class="secondary" type="button" disabled>Copy link</button>
        </div>

        <div class="button-row">
          <button id="newGameButton" type="button">Start game</button>
        </div>

        <section class="players-block" aria-labelledby="players-title">
          <h2 id="players-title">Players</h2>
          <div id="playersList" class="players-list"></div>
        </section>

        <div class="panel-block">
          <h2>Log</h2>
          <ol id="actionLog" class="action-log" aria-live="polite">
            <li>Create a room or open a shared link.</li>
          </ol>
        </div>
      </aside>
    </main>
  </body>
</html>
